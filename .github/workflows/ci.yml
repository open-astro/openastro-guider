# openastro-guider CI
#
# This repo is being turned from the inherited PHD2 fork into a Linux-only,
# headless, Alpaca-only guiding daemon (see design/PHD2_HEADLESS_PLAYBOOK.md).
# Per the playbook's strip-before-build order, the macOS / Windows / Linux
# *compile* jobs are intentionally NOT here yet: the tree still carries the
# INDI backend (removed in Phase 3) plus GUI/locale weight that broke the
# first build attempt. The Linux build + GTest gate (and clang-tidy + CodeQL,
# which need a configured build) come back on `ubuntu-24.04` once INDI is
# stripped — playbook §5.
#
# Until then CI is the set of checks that need no project build, kept green and
# meaningful on the in-flight tree:
#
#   sanity      design/tracking docs exist (playbook + the GUIDER_* files)
#   format      clang-format, PR changed lines only
#   cppcheck    C/C++ static analysis, PR changed files only
#   unicode     scan sources for Trojan-Source / invisible Unicode
#   line-endings PR-modified files must not flip CRLF/LF style (PR #57 incident)
#   shellcheck  lint the Debian/headless shell scripts we maintain
#   zizmor      security audit of these GitHub Actions workflows
#
# Style/static checks are scoped to PR-changed lines/files so the large
# inherited PHD2 tree (which predates .clang-format) is never bulk-flagged —
# the same policy AlpacaBridge and openastro-ara use.
#
# Actions are pinned to immutable commit SHAs (enforced by the zizmor job).

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# A newer push to the same ref makes in-flight runs obsolete — cancel them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sanity:
    name: Sanity (design docs)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.x pinned (immutable ref)
        with:
          persist-credentials: false

      - name: Verify required design docs exist
        # The headless port is driven by these tracking files (playbook §7);
        # a sub-PR that deletes or empties one should fail loudly rather than
        # silently losing the plan of record.
        run: |
          set -euo pipefail
          for f in \
            design/PHD2_HEADLESS_PLAYBOOK.md \
            design/GUIDER_PROGRESS.md \
            design/GUIDER_DECISIONS.md \
            design/GUIDER_TODO.md \
            design/API_CONTRACT.md \
          ; do
            if [ ! -s "$f" ]; then
              echo "::error file=$f::Required design doc missing or empty"
              exit 1
            fi
            echo "ok: $f ($(wc -l < "$f") lines)"
          done

  format:
    name: clang-format (changed lines)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install clang-format
        # clang-format-18 matches build/run-clang-format and the .clang-format
        # features in use (RemoveParentheses etc. need >= 17).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18

      - name: Check formatting of changed lines
        # git-clang-format reformats only the lines this PR touched, so the
        # pre-existing tree is never flagged. Scoped to the authored C/C++
        # source dirs (matches build/run-clang-format); thirdparty/, WinLibs/
        # and contributions/ outside the GP module are left alone.
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          merge_base="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)"
          # git-clang-format --diff exits non-zero when it finds differences.
          # `|| true` keeps `set -e` from aborting at this assignment so the
          # check below runs and prints the diff + fix hint, instead of the job
          # dying with a bare "exit 1" and no actionable output.
          diff="$(git-clang-format-18 --binary clang-format-18 --commit "$merge_base" --diff \
            --extensions c,cc,cpp,cxx,h,hh,hpp,hxx \
            -- src contributions/MPI_IS_gaussian_process)" || true
          if [ "$diff" != "no modified files to format" ] && \
             [ "$diff" != "clang-format did not modify any files" ]; then
            echo "$diff"
            echo "::error::Formatting issues on changed lines. Fix locally with: git-clang-format-18 $merge_base"
            exit 1
          fi
          echo "Formatting OK"

  cppcheck:
    name: cppcheck (changed lines)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck

      - name: Analyze changed C/C++ lines
        # Static analysis that needs no build (cppcheck parses sources directly),
        # so it works pre-INDI-strip. cppcheck necessarily parses each changed
        # file *plus the headers it #includes*, so it reports findings all over
        # the large inherited PHD2 tree. We therefore gate only on findings that
        # land on lines THIS PR actually added/modified — the same changed-lines
        # policy the clang-format job uses — so pre-existing tree issues are not
        # bulk-flagged here. The tree-wide backlog is tracked in the
        # static-analysis epic (#10); suppress a real local false positive
        # inline with `// cppcheck-suppress <id>`.
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          merge_base="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$merge_base" HEAD -- \
            src tests \
            | grep -E '\.(c|cc|cpp|cxx|h|hpp|hxx)$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed C/C++ files — nothing to analyze."
            exit 0
          fi
          printf 'Analyzing:\n%s\n' "${files[*]}"

          # 1) Run cppcheck (machine-readable; don't fail the step yet).
          #    --library=wxwidgets teaches cppcheck the wx macros, eliminating
          #    the bulk of unknownMacro false positives.
          cppcheck \
            --enable=warning,performance,portability \
            --inline-suppr \
            --std=c++20 \
            --language=c++ \
            --quiet \
            --check-level=exhaustive \
            --library=wxwidgets \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --suppress=normalCheckLevelMaxBranches \
            --suppress=toomanyconfigs \
            --template='{file}:{line}: {severity}: {message} [{id}]' \
            -I src \
            "${files[@]}" 2> cppcheck.out || true
          sort -u cppcheck.out -o cppcheck.out

          # 2) Collect the file:line pairs this PR added/modified.
          git diff -U0 "$merge_base" HEAD -- "${files[@]}" \
            | awk '
                /^\+\+\+ / { f=$2; sub(/^b\//,"",f); next }
                /^@@ /     { split($3, h, ","); s=h[1]; sub(/^\+/,"",s);
                             n=(h[2]==""?1:h[2]);
                             for (i=0;i<n;i++) print f":"(s+i); }
              ' | sort -u > changed_lines.txt

          # 3) Keep only findings on a changed line.
          : > gated.out
          while IFS= read -r finding; do
            [ -n "$finding" ] || continue
            fileline="${finding%%: *}"
            if grep -qxF "$fileline" changed_lines.txt; then
              printf '%s\n' "$finding" >> gated.out
            fi
          done < cppcheck.out

          if [ -s gated.out ]; then
            echo "::error::cppcheck found issues on lines this PR changed:"
            cat gated.out
            exit 1
          fi
          echo "cppcheck OK — no findings on changed lines."
          echo "(Tree-wide findings are tracked in the static-analysis epic #10.)"

  unicode:
    name: Unicode scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Scan for Trojan-Source / invisible Unicode
        # Guards against CVE-2021-42574: bidi controls / zero-width characters
        # (incl. BOMs) that make source render differently than it compiles.
        run: python3 .github/scripts/check-unicode.py

  line-endings:
    name: Line endings (CRLF flip guard)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed files for line-ending flips
        # The sources inherited from upstream PHD2 are CRLF, and keeping them
        # that way is what keeps this fork diffable against upstream. PR #57
        # wholesale-flipped four of them to LF — a ~140-line feature merged as
        # a ~25k-line diff — and nothing caught it (fixed in PR #62). This job
        # compares each modified file's ending style at the merge-base against
        # the PR head and fails on a flip in either direction: CRLF -> LF is
        # the PR #57 incident, LF -> CRLF is Windows-tooling contamination of
        # our own LF files. Files whose endings git already forces via
        # .gitattributes (*.bat, *.sh) pass trivially since both sides compare
        # equal. Mixed-ending edits (a CRLF file gaining some LF lines) are
        # not flagged — only a total flip of an existing style is. A PR that
        # flips endings *on purpose* (like the PR #62 restore) is expected to
        # fail here; that is a maintainer-acknowledge-and-merge situation, not
        # a reason to weaken the check.
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          merge_base="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)"
          fail=0
          while IFS= read -r f; do
            # skip files git considers binary (numstat shows "-" for them)
            if git diff --numstat --no-renames "$merge_base" HEAD -- "$f" | grep -q '^-'; then
              continue
            fi
            old_crlf="$(git show "$merge_base:$f" | grep -c $'\r$' || true)"
            new_crlf="$(git show "HEAD:$f" | grep -c $'\r$' || true)"
            old_crlf="${old_crlf:-0}"
            new_crlf="${new_crlf:-0}"
            if [ "$old_crlf" -gt 0 ] && [ "$new_crlf" -eq 0 ]; then
              echo "::error file=$f::line endings flipped CRLF -> LF ($old_crlf CRLF lines at merge-base, 0 now). Restore with: sed -i 's/\$/\r/' $f"
              fail=1
            elif [ "$old_crlf" -eq 0 ] && [ "$new_crlf" -gt 0 ]; then
              echo "::error file=$f::line endings flipped LF -> CRLF (0 CRLF lines at merge-base, $new_crlf now). Restore with: sed -i 's/\r\$//' $f"
              fail=1
            fi
          done < <(git diff --name-only --no-renames --diff-filter=M "$merge_base" HEAD)
          if [ "$fail" -eq 0 ]; then
            echo "no line-ending flips in modified files"
          fi
          exit "$fail"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Lint shell scripts
        # Explicit allowlist of the Debian/headless scripts we actively
        # maintain — all clean today. The inherited macOS (build-dmg.sh,
        # run_dmg.sh), Windows (*_win) and proprietary-SDK unpacker scripts
        # (build/unpack_*) are intentionally excluded: they are removed in
        # Phases 1-3, so linting them now would gate CI on code headed for
        # deletion. Add a script to this list as it is cleaned up / when a new
        # maintained script lands. debian/ maintainer scripts have no .sh
        # extension, so they are listed by name. Each path is existence-guarded:
        # Phases 1-3 delete scripts, and a rename/removal of a listed file must
        # cleanly drop out of the set rather than fail the job with "file not
        # found".
        run: |
          set -euo pipefail
          candidates=(
            build-deb.sh
            run_deb.sh
            debian/openastro-guider.postinst
            debian/openastro-guider.postrm
            debian/openastro-guider.prerm
          )
          scripts=()
          for f in "${candidates[@]}"; do
            if [ -f "$f" ]; then
              scripts+=("$f")
            else
              echo "::notice::skipping $f (no longer present)"
            fi
          done
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No maintained shell scripts present — nothing to lint."
            exit 0
          fi
          echo "Linting: ${scripts[*]}"
          shellcheck "${scripts[@]}"

  zizmor:
    name: zizmor (workflow audit)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Install zizmor
        # Prebuilt x86_64 release binary — no Rust toolchain / pip build needed.
        # The tarball is checksum-verified before it runs: a security-audit job
        # must not itself execute an unverified download. Bump both `ver` and
        # `sha256` together when upgrading (GitHub release assets are immutable,
        # so the hash is stable for a given version).
        run: |
          set -euo pipefail
          ver=1.25.2
          sha256=aa1facd105f0d83fe5c55b1adcd9d7417de5d83aa27471f91dc0b66cf3803577
          curl -fsSL "https://github.com/zizmorcore/zizmor/releases/download/v${ver}/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
            -o /tmp/zizmor.tgz
          echo "${sha256}  /tmp/zizmor.tgz" | sha256sum --check --strict -
          tar -xzf /tmp/zizmor.tgz -C /tmp
          # Fail explicitly if a future release changes the archive layout,
          # rather than relying on `install` to error on a missing path.
          if [ ! -x /tmp/zizmor ]; then
            echo "::error::zizmor binary not found at /tmp/zizmor after extraction (archive layout changed?)"
            exit 1
          fi
          sudo install /tmp/zizmor /usr/local/bin/zizmor
          zizmor --version

      - name: Audit workflows
        # Offline audit: deterministic, no token/network. Audits the workflow
        # files for security issues (injection, over-broad permissions,
        # unpinned actions, etc.).
        run: zizmor --offline .github/workflows/
